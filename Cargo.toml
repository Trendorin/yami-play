[package]
name = "yami-play"
version = "3.0.0"
edition = "2021"
description = "Video and music player for Wayland (libmpv, loaded at run time)"
license = "MIT"
publish = false

[[bin]]
name = "yami-play"
path = "src/main.rs"

[dependencies]
yami-px = { git = "https://github.com/Trendorin/yami", tag = "px-v3.0.0", features = ["tiny5"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
